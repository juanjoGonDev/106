<!doctype html>
<html lang="es">
<head>
  <script src="./privacy-bootstrap.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090c">
  <meta name="color-scheme" content="dark">
  <title>Contraseña — Minuto 106</title>
  <meta name="description" content="Cambia o restablece la contraseña de tu cuenta de Minuto 106.">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./v2.css">
  <link rel="stylesheet" href="./v4.css">
  <link rel="stylesheet" href="./v18.css">
  <link rel="stylesheet" href="./v20.css">
  <link rel="stylesheet" href="./v21.css">
  <link rel="stylesheet" href="./password-visibility.css">
</head>
<body data-auth-page="reset">
  <header class="site-header"></header>
  <main class="password-reset-page" data-auth-shell data-password-mode="unavailable">
    <section class="password-reset-card" aria-labelledby="passwordResetTitle">
      <p id="passwordResetEyebrow" class="eyebrow">RECUPERACIÓN SEGURA</p>
      <h1 id="passwordResetTitle">Contraseña</h1>
      <p id="passwordResetLead">Validando la sesión segura…</p>
      <div class="password-reset-fields">
        <div id="currentPasswordField" class="password-field-group" hidden>
          <label for="currentPassword">Contraseña actual</label>
          <input id="currentPassword" type="password" autocomplete="current-password" maxlength="128" aria-describedby="currentPasswordHint">
          <p id="currentPasswordHint" class="auth-password-match">Necesaria para confirmar que eres tú.</p>
        </div>
        <label for="newPassword">Nueva contraseña</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" aria-describedby="passwordResetRequirements">
        <ul id="passwordResetRequirements" class="auth-password-requirements password-reset-requirements" aria-label="Requisitos de contraseña"></ul>
        <label for="confirmNewPassword">Repite la contraseña</label>
        <input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" aria-describedby="passwordResetMatch">
        <p id="passwordResetMatch" class="auth-password-match password-reset-match" role="status" aria-live="polite"></p>
      </div>
      <p id="passwordResetStatus" class="password-reset-status" role="status" aria-live="polite">Validando la sesión…</p>
      <div class="password-reset-actions">
        <button id="updatePassword" class="primary" type="button" disabled>Guardar nueva contraseña</button>
        <a id="returnToAccount" class="ghost" href="./cuenta.html" hidden>Volver a Mi cuenta</a>
      </div>
    </section>
  </main>
  <footer class="site-footer"></footer>
  <script src="./config.js"></script>
  <script src="./layout.js"></script>
  <script src="./access.js"></script>
  <script type="module" src="./password-visibility.js"></script>
  <script type="module" src="./password-reset.js"></script>
</body>
</html>
