<!doctype html>
<html lang="es">
<head>
  <script src="./privacy-bootstrap.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090c">
  <title>Restablecer contraseña — Minuto 106</title>
  <meta name="description" content="Elige una nueva contraseña para tu cuenta de Minuto 106.">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./v2.css">
  <link rel="stylesheet" href="./v4.css">
  <link rel="stylesheet" href="./v18.css">
</head>
<body>
  <header class="site-header"></header>
  <main class="password-reset-page">
    <section class="password-reset-card" aria-labelledby="passwordResetTitle">
      <p class="eyebrow">RECUPERACIÓN SEGURA</p>
      <h1 id="passwordResetTitle">Nueva contraseña</h1>
      <p>El enlace solo puede utilizarse durante un tiempo limitado. Elige una contraseña que no uses en otros servicios.</p>
      <div class="password-reset-fields">
        <label for="newPassword">Nueva contraseña</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128">
        <label for="confirmNewPassword">Repite la contraseña</label>
        <input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128">
      </div>
      <p id="passwordResetStatus" class="password-reset-status" role="status" aria-live="polite">Validando el enlace…</p>
      <div class="password-reset-actions">
        <button id="updatePassword" class="primary" type="button" disabled>Guardar nueva contraseña</button>
        <a id="returnToAccount" class="ghost" href="./cuenta.html" hidden>Volver a Mi cuenta</a>
      </div>
    </section>
  </main>
  <footer class="site-footer"></footer>
  <script src="./config.js"></script>
  <script src="./layout.js"></script>
  <script type="module" src="./password-reset.js"></script>
</body>
</html>
