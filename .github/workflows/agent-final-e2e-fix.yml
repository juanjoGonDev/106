name: Agent Final Ranked E2E Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: agent-final-ranked-e2e-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'juanjoGonDev/106' && github.event.pull_request.head.ref == 'agent/security-ranked-game-anti-cheat'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/security-ranked-game-anti-cheat
          fetch-depth: 0

      - name: Apply exact UI and E2E fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after):
              file = Path(path)
              source = file.read_text()
              if source.count(before) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target')
              file.write_text(source.replace(before, after))

          replace_once(
              'public/human-check.js',
              "    document.querySelector('#nick')?.focus();\n",
              "    document.querySelector('#startButton')?.focus({ preventScroll: true });\n",
          )

          replace_once(
              'tests/e2e/ranked-anti-cheat.e2e.js',
              "function isExpectedNavigationAbort(request) {\n  return request.resourceType() === 'image'\n    && request.failure()?.errorText === 'net::ERR_ABORTED'\n    && /\\/functions\\/v1\\/player-share\\/.+\\/card\\.png(?:\\?|$)/.test(request.url());\n}\n",
              "function isExpectedNavigationAbort(request) {\n  const url = new URL(request.url());\n  return request.failure()?.errorText === 'net::ERR_ABORTED'\n    && url.origin === apiUrl.replace(/\\/$/, '')\n    && /^\\/functions\\/v1\\/player-share\\/[^/]+\\/card\\.png$/.test(url.pathname);\n}\n",
          )

          replace_once(
              'tests/e2e/ranked-anti-cheat.e2e.js',
              "  await profileResponse;\n  await expect(page.locator('#profileCard')).toBeVisible({ timeout: 25_000 });\n",
              "  await profileResponse;\n  await page.locator('#profileCard').scrollIntoViewIfNeeded();\n  await expect(page.locator('#profileCard')).toBeVisible({ timeout: 25_000 });\n",
          )

          replace_once(
              'tests/e2e/ranked-anti-cheat.e2e.js',
              "  await expect(page.locator('#nick')).toBeFocused();\n",
              "  await expect(page.locator('#startButton')).toBeFocused();\n",
          )
          PY

          git rm .github/workflows/agent-final-e2e-fix.yml
          changed="$(git diff HEAD --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/agent-final-e2e-fix.yml \
            public/human-check.js \
            tests/e2e/ranked-anti-cheat.e2e.js | sort)"
          test "$changed" = "$expected"
          node --check public/human-check.js
          node --check tests/e2e/ranked-anti-cheat.e2e.js

      - name: Commit focused final fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/human-check.js tests/e2e/ranked-anti-cheat.e2e.js
          git commit -m 'fix(test): stabilize final ranked journey'
          git push origin HEAD:agent/security-ranked-game-anti-cheat
