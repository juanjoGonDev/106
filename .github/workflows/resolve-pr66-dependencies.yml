name: Resolve PR 66 dependency lockfile

on:
  push:
    branches:
      - agent/ci-lock-resolver

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve and commit audited lockfile
    if: github.repository == 'juanjoGonDev/106' && github.actor == 'juanjoGonDev'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch as data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/security-ranked-integrity-reconciliation
          fetch-depth: 1
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0

      - name: Prepare exact security overrides
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'pnpm-workspace.yaml';
          const source = fs.readFileSync(path, 'utf8');
          const marker = '# Security exceptions for newly released patched versions.';
          const markerIndex = source.indexOf(marker);
          if (markerIndex === -1) {
            throw new Error('Expected security override marker was not found.');
          }
          const prefix = source.slice(0, markerIndex).trimEnd();
          fs.writeFileSync(
            path,
            `${prefix}\n\n# Temporary maturity exception for the newly published security patch. Remove after 7 days.\nminimumReleaseAgeExclude:\n  - brace-expansion@5.0.9 # GHSA-rgw5-rvv9-x895\n\noverrides:\n  postcss: 8.5.19\n  brace-expansion: 5.0.9\n  nanoid: 5.1.16\n`,
          );
          NODE

      - name: Resolve lockfile without executing repository lifecycle code
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - name: Reject high or critical dependency advisories
        run: pnpm audit --audit-level=high

      - name: Verify exact resolved graph
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "eslint@10.7.0" pnpm-lock.yaml
          grep -Fq "brace-expansion@5.0.9" pnpm-lock.yaml
          grep -Fq "nanoid@5.1.16" pnpm-lock.yaml
          ! grep -Fq "brace-expansion@5.0.8" pnpm-lock.yaml
          ! grep -Fq "nanoid@3.3.15" pnpm-lock.yaml
          git diff --exit-code -- package.json

      - name: Commit only dependency policy and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-workspace.yaml pnpm-lock.yaml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'fix(deps): patch audited transitive dependencies'
          git push origin HEAD:agent/security-ranked-integrity-reconciliation
