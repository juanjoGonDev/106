name: Cleanup PR 37 temporary branch

on:
  push:
    branches:
      - agent/feat-league-directory-scheduling

permissions:
  contents: write

concurrency:
  group: cleanup-pr-37-temporary-branch
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove temporary evidence branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/feat-league-directory-scheduling
          fetch-depth: 0

      - name: Delete temporary evidence branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/pr-evidence/37" || true

      - name: Remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-pr-37.yml
          git commit -m "chore(ci): remove temporary cleanup workflow"
          git push origin HEAD:agent/feat-league-directory-scheduling
