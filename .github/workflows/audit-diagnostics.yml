name: One-time Lockfile Repair

on:
  push:
    branches:
      - agent/feat-competitive-progression
    paths:
      - .github/workflows/audit-diagnostics.yml

permissions: read-all

jobs:
  repair:
    name: Commit audited lockfile
    if: github.repository == 'juanjoGonDev/106' && github.actor == 'juanjoGonDev'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Regenerate and commit only the lockfile
        env:
          BRANCH: agent/feat-competitive-progression
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$HEAD_SHA" in
            (*[!0-9a-f]*|'') echo "Invalid commit SHA" >&2; exit 1 ;;
          esac
          test "$BRANCH" = "agent/feat-competitive-progression"
          test "$REPOSITORY" = "juanjoGonDev/106"

          base_url="https://raw.githubusercontent.com/${REPOSITORY}/${HEAD_SHA}"
          curl --fail --silent --show-error --location "$base_url/package.json" --output package.json
          curl --fail --silent --show-error --location "$base_url/pnpm-lock.yaml" --output pnpm-lock.yaml
          curl --fail --silent --show-error --location "$base_url/pnpm-workspace.yaml" --output pnpm-workspace.yaml

          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          pnpm install --lockfile-only --ignore-scripts
          pnpm audit --audit-level high

          metadata_url="https://api.github.com/repos/${REPOSITORY}/contents/pnpm-lock.yaml?ref=${BRANCH}"
          current_sha="$(curl --fail --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$metadata_url" | jq --raw-output '.sha')"
          test -n "$current_sha"
          test "$current_sha" != "null"

          encoded_lockfile="$(base64 --wrap=0 pnpm-lock.yaml)"
          payload="$(jq --null-input \
            --arg message 'fix(deps): refresh audited lockfile' \
            --arg content "$encoded_lockfile" \
            --arg sha "$current_sha" \
            --arg branch "$BRANCH" \
            '{message: $message, content: $content, sha: $sha, branch: $branch}')"

          curl --fail --silent --show-error --location \
            --request PUT \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${REPOSITORY}/contents/pnpm-lock.yaml" \
            | jq --exit-status '.commit.sha'
