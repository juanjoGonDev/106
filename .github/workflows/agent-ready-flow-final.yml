name: Agent Final Ready Flow Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: agent-final-ready-flow-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'juanjoGonDev/106' && github.event.pull_request.head.ref == 'agent/security-ranked-game-anti-cheat'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/security-ranked-game-anti-cheat
          fetch-depth: 0

      - name: Apply bounded final fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ci_path = Path('.github/workflows/ci.yml')
          ci_source = ci_path.read_text()
          marker = '  supabase-integration:\n'
          marker_index = ci_source.index(marker)
          timeout_before = '    timeout-minutes: 3\n'
          timeout_index = ci_source.index(timeout_before, marker_index)
          timeout_expression = '$' + "{{ matrix.suite == 'ready-flow' && 6 || 3 }}"
          ci_source = (
              ci_source[:timeout_index]
              + f'    timeout-minutes: {timeout_expression}\n'
              + ci_source[timeout_index + len(timeout_before):]
          )

          setup_before = "        if: matrix.suite == 'auth-browser'\n        uses: pnpm/action-setup"
          setup_after = "        if: matrix.suite == 'auth-browser' || matrix.suite == 'ready-flow'\n        uses: pnpm/action-setup"
          if ci_source.count(setup_before) != 1:
              raise SystemExit('ci.yml: expected one pnpm setup condition')
          ci_path.write_text(ci_source.replace(setup_before, setup_after))

          human_path = Path('public/human-check.js')
          human_source = human_path.read_text()
          focus_before = "    document.querySelector('#startButton')?.focus({ preventScroll: true });\n"
          focus_after = "    window.setTimeout(() => {\n      document.querySelector('#startButton')?.focus({ preventScroll: true });\n    }, 0);\n"
          if human_source.count(focus_before) != 1:
              raise SystemExit('human-check.js: expected one focus target')
          human_path.write_text(human_source.replace(focus_before, focus_after))
          PY

          git rm .github/workflows/agent-ready-flow-final.yml
          changed="$(git diff HEAD --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/agent-ready-flow-final.yml \
            .github/workflows/ci.yml \
            public/human-check.js | sort)"
          test "$changed" = "$expected"
          node --check public/human-check.js

      - name: Commit final ready-flow fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/ci.yml public/human-check.js
          git commit -m 'fix(ci): complete live ranked validation'
          git push origin HEAD:agent/security-ranked-game-anti-cheat
