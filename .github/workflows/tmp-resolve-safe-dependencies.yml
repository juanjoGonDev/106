name: Temporary safe dependency resolver

on:
  push:
    branches:
      - agent/security-ranked-integrity-reconciliation
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: tmp-safe-dependency-resolver-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve audited dependency graph
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/agent/security-ranked-integrity-reconciliation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0

      - name: Prepare candidate manifests
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          manifest.devDependencies['@eslint/js'] = '9.39.5';
          manifest.devDependencies.eslint = '9.39.5';
          fs.writeFileSync('package.json', `${JSON.stringify(manifest, null, 2)}\n`);

          const workspacePath = 'pnpm-workspace.yaml';
          const workspace = fs.readFileSync(workspacePath, 'utf8');
          const marker = '# Security exceptions for newly released patched versions.';
          const markerIndex = workspace.indexOf(marker);
          if (markerIndex === -1) {
            throw new Error('Expected security override marker was not found.');
          }
          const prefix = workspace.slice(0, markerIndex).trimEnd();
          fs.writeFileSync(
            workspacePath,
            `${prefix}\n\noverrides:\n  postcss: 8.5.19\n  nanoid: 5.1.16\n`,
          );
          NODE

      - name: Resolve lockfile under repository policy
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Validate package policy
        run: node scripts/check-package-policy.mjs

      - name: Reject high or critical dependency advisories
        run: pnpm audit --audit-level=high

      - name: Verify intended graph
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "eslint@9.39.5" pnpm-lock.yaml
          grep -Fq "nanoid@5.1.16" pnpm-lock.yaml
          if grep -Fq "brace-expansion@5.0.8" pnpm-lock.yaml; then
            echo 'Vulnerable brace-expansion 5.0.8 is still present.' >&2
            exit 1
          fi

      - name: Emit deterministic candidate files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum package.json pnpm-workspace.yaml pnpm-lock.yaml
          echo '::group::candidate-files-base64'
          printf 'PACKAGE_JSON_B64=' && base64 -w0 package.json && printf '\n'
          printf 'PNPM_WORKSPACE_B64=' && base64 -w0 pnpm-workspace.yaml && printf '\n'
          printf 'PNPM_LOCK_B64=' && base64 -w0 pnpm-lock.yaml && printf '\n'
          echo '::endgroup::'
