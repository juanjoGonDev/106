name: Player Pages and Social Cards

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: read-all

concurrency:
  group: player-pages-${{ github.event.pull_request.head.repo.full_name }}-${{ github.head_ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.13.0
  PNPM_VERSION: 11.15.1
  PLAYWRIGHT_VERSION: 1.60.0
  COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
  EVIDENCE_SHARDS_PER_PROJECT: 8

jobs:
  coverage:
    name: 🧮 Frontend modules · 100% coverage
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Enforce readiness controller coverage
        run: pnpm test:ready-flow:coverage

      - name: Enforce bounded attempt timing coverage
        run: pnpm test:attempt-timing:coverage

      - name: Enforce player route and flag coverage
        run: pnpm test:player-ui:coverage

      - name: Enforce completed-attempt refresh coverage
        run: pnpm test:attempt-refresh:coverage

      - name: Enforce achievement notification coverage
        run: pnpm test:achievement-unlocks:coverage

      - name: Enforce league directory coverage
        run: pnpm test:league-directory:coverage

      - name: Enforce daily attempt limit coverage
        run: pnpm test:daily-attempts:coverage

      - name: Enforce public asset audit coverage
        run: pnpm test:public-assets:coverage

      - name: Enforce PR visual evidence coverage
        run: pnpm test:pr-visual-evidence:coverage

      - name: Enforce platform evidence coverage
        run: pnpm test:platform-evidence:coverage

      - name: Enforce evidence fragment merge coverage
        run: pnpm test:platform-evidence-fragments:coverage

      - name: Enforce Playwright failure summary coverage
        run: pnpm test:playwright-failure-summary:coverage

      - name: Audit public assets
        run: pnpm check:public-assets

  browser-shards:
    name: 🌐 Capture · ${{ matrix.project }} · ${{ matrix.shard }}/8
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        project: [desktop-chrome, mobile-chrome]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate package policy before installation
        run: node scripts/check-package-policy.mjs

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run isolated responsive journey shard
        shell: bash
        env:
          PR_VISUAL_CAPTURE: '1'
          PLATFORM_EVIDENCE_FRAGMENT: '1'
        run: |
          set -o pipefail
          pnpm run test:e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ env.EVIDENCE_SHARDS_PER_PROJECT }} 2>&1 | tee playwright-output.txt
          touch ".tmp/pr-previews/.fragment-raw-${{ matrix.project }}-${{ matrix.shard }}"

      - name: Summarize failed shard
        id: failure
        if: failure()
        run: node scripts/playwright-failure-summary.mjs >> "$GITHUB_OUTPUT"

      - name: Upload raw evidence fragment
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-evidence-raw-fragment-${{ matrix.project }}-${{ matrix.shard }}
          path: .tmp/pr-previews
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload failed shard diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: player-browser-${{ matrix.project }}-${{ matrix.shard }}-${{ steps.failure.outputs.slug }}
          path: |
            playwright-output.txt
            playwright-results.json
            playwright-report
            test-results
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

  gif-shards:
    name: 🎞️ GIF · ${{ matrix.project }} · ${{ matrix.shard }}/8
    if: github.event.pull_request.draft == false
    needs: browser-shards
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        project: [desktop-chrome, mobile-chrome]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download raw evidence fragment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: platform-evidence-raw-fragment-${{ matrix.project }}-${{ matrix.shard }}
          path: .tmp/pr-previews

      - name: Encode shard recordings as GIF
        run: |
          node scripts/create-preview-gif.mjs
          touch ".tmp/pr-previews/.fragment-gif-${{ matrix.project }}-${{ matrix.shard }}"

      - name: Upload GIF evidence fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-evidence-gif-fragment-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            .tmp/pr-previews/*.gif
            .tmp/pr-previews/.fragment-gif-${{ matrix.project }}-${{ matrix.shard }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  browser:
    name: 🌐 Platform · Desktop, mobile and recordings
    if: github.event.pull_request.draft == false
    needs: [browser-shards, gif-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download isolated evidence fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: platform-evidence-*-fragment-*
          path: .tmp/platform-evidence-fragments

      - name: Merge fragments and validate complete inventory
        run: |
          node scripts/merge-platform-evidence.mjs
          node scripts/package-platform-evidence.mjs

      - name: Upload downloadable platform evidence ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-evidence-${{ github.run_id }}
          path: .tmp/pr-previews
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
