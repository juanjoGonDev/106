name: Agent Final Live Ranked Corrections

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: agent-final-live-ranked-corrections
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'juanjoGonDev/106' && github.event.pull_request.head.ref == 'agent/security-ranked-game-anti-cheat'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/security-ranked-game-anti-cheat
          fetch-depth: 0

      - name: Apply exact focus and persistence fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, before, after):
              file = Path(path)
              source = file.read_text()
              if source.count(before) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target')
              file.write_text(source.replace(before, after))

          replace_once(
              'public/human-check.js',
              "  const LOADING_DELAY_MS = 180;\n",
              "  const LOADING_DELAY_MS = 180;\n  const FOCUS_RESTORE_TIMEOUT_MS = 5_000;\n",
          )

          replace_once(
              'public/human-check.js',
              "  function restoreSetupSurface() {\n",
              "  function focusStartWhenEnabled() {\n    const startButton = document.querySelector('#startButton');\n    if (!startButton) return;\n\n    const focus = () => {\n      if (!startButton.isConnected || startButton.disabled) return false;\n      startButton.focus({ preventScroll: true });\n      return true;\n    };\n    if (focus()) return;\n\n    const observer = new MutationObserver(() => {\n      if (!focus()) return;\n      observer.disconnect();\n      window.clearTimeout(timeoutId);\n    });\n    const timeoutId = window.setTimeout(() => observer.disconnect(), FOCUS_RESTORE_TIMEOUT_MS);\n    observer.observe(startButton, { attributes: true, attributeFilter: ['disabled'] });\n  }\n\n  function restoreSetupSurface() {\n",
          )

          replace_once(
              'public/human-check.js',
              "    window.setTimeout(() => {\n      document.querySelector('#startButton')?.focus({ preventScroll: true });\n    }, 0);\n",
              "    focusStartWhenEnabled();\n",
          )

          replace_once(
              'tests/e2e/ranked-anti-cheat.e2e.js',
              "  await profileResponse;\n  await page.locator('#profileCard').scrollIntoViewIfNeeded();\n  await expect(page.locator('#profileCard')).toBeVisible({ timeout: 25_000 });\n  await expect(page.locator('#attemptHistory')).toContainText(`${displayedSeconds.toFixed(3)} s`);\n\n  const horizontalOverflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1);\n  expect(horizontalOverflow).toBe(false);\n",
              "  const persistedResponse = await profileResponse;\n  const persistedContext = await persistedResponse.json();\n  expect(persistedContext.availability).toBe('owned');\n  expect(persistedContext.profile.history).toEqual(expect.arrayContaining([\n    expect.objectContaining({ elapsedMs: Math.round(displayedSeconds * 1_000) }),\n  ]));\n\n  const homeOverflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1);\n  expect(homeOverflow).toBe(false);\n\n  await page.goto(`/player/${encodeURIComponent(nick)}`);\n  await expect(page.locator('#playerHistory')).toContainText(`${displayedSeconds.toFixed(3)} s`, { timeout: 25_000 });\n  const profileOverflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1);\n  expect(profileOverflow).toBe(false);\n",
          )
          PY

          test "$(git diff --name-only | sort)" = "$(printf '%s\n' public/human-check.js tests/e2e/ranked-anti-cheat.e2e.js | sort)"
          node --check public/human-check.js
          node --check tests/e2e/ranked-anti-cheat.e2e.js

      - name: Commit focused corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/human-check.js tests/e2e/ranked-anti-cheat.e2e.js
          git commit -m 'fix(game): complete responsive ranked recovery'
          git push origin HEAD:agent/security-ranked-game-anti-cheat
