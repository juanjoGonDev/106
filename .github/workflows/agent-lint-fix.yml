name: Agent Guarded Raster Lint Fix

on:
  push:
    branches: [agent/security-ranked-game-anti-cheat]

permissions:
  contents: write

concurrency:
  group: agent-guarded-raster-lint-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'juanjoGonDev/106' && github.ref == 'refs/heads/agent/security-ranked-game-anti-cheat'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/security-ranked-game-anti-cheat
          fetch-depth: 0

      - name: Remove redundant initialization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('public/human-check.js')
          source = path.read_text()
          before = '    let fixtureEnabled = false;\n'
          after = '    let fixtureEnabled;\n'
          if source.count(before) != 1:
              raise SystemExit('Expected one fixture initialization')
          path.write_text(source.replace(before, after))
          PY
          node --check public/human-check.js
          test "$(git diff --name-only)" = "public/human-check.js"

      - name: Commit focused lint fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/human-check.js
          git commit -m 'fix(test): satisfy guarded raster lint'
          git push origin HEAD:agent/security-ranked-game-anti-cheat
