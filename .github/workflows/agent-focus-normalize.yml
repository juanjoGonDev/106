name: Agent Focus Normalization

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'juanjoGonDev/106' && github.event.pull_request.head.ref == 'agent/security-ranked-game-anti-cheat'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/security-ranked-game-anti-cheat
          fetch-depth: 0

      - name: Normalize deferred focus
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('public/human-check.js')
          source = path.read_text()
          before = "    window.setTimeout(() => {\n      window.setTimeout(() => {\n      document.querySelector('#startButton')?.focus({ preventScroll: true });\n    }, 0);\n    }, 0);\n"
          after = "    window.setTimeout(() => {\n      document.querySelector('#startButton')?.focus({ preventScroll: true });\n    }, 0);\n"
          if source.count(before) != 1:
              raise SystemExit('Expected one duplicated focus wrapper')
          path.write_text(source.replace(before, after))
          PY
          test "$(git diff --name-only)" = "public/human-check.js"
          node --check public/human-check.js

      - name: Commit normalized focus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/human-check.js
          git commit -m 'fix(game): normalize verification focus recovery'
          git push origin HEAD:agent/security-ranked-game-anti-cheat
