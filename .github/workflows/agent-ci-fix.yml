name: Agent Focused CI Fix

on:
  push:
    branches: [agent/security-ranked-game-anti-cheat]

permissions:
  contents: write

concurrency:
  group: agent-focused-ci-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'juanjoGonDev/106' && github.ref == 'refs/heads/agent/security-ranked-game-anti-cheat'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/security-ranked-game-anti-cheat
          fetch-depth: 0

      - name: Apply exact contract updates
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          function replaceOnce(path, before, after) {
            const source = readFileSync(path, 'utf8');
            const first = source.indexOf(before);
            if (first < 0 || source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`${path}: expected exactly one replacement target`);
            }
            writeFileSync(path, source.replace(before, after));
          }

          replaceOnce(
            '.github/workflows/ci.yml',
            "if: matrix.suite == 'auth-browser'\n        uses: pnpm/action-setup",
            "if: matrix.suite == 'auth-browser' || matrix.suite == 'ready-flow'\n        uses: pnpm/action-setup",
          );

          replaceOnce(
            'scripts/run-playwright.mjs',
            "const videoDisabled = process.env.PLAYWRIGHT_DISABLE_VIDEO === '1';\n",
            "const videoDisabled = process.env.PLAYWRIGHT_DISABLE_VIDEO === '1';\nconst runsRankedLiveSuite = playwrightArguments.some((argument) => argument.includes('@live-ranked-anti-cheat'));\nif (!runsRankedLiveSuite && process.env.SUPABASE_RANKED_ANTICHEAT_LIVE !== '1') {\n  playwrightArguments.push('--grep-invert=@live-ranked-anti-cheat');\n}\n",
          );

          replaceOnce(
            'public/human-check.js',
            "    for (const id of ['setup', 'playing', 'result']) {\n      document.querySelector(`#${id}`)?.classList.toggle('active', id === 'setup');\n    }\n  }",
            "    for (const id of ['setup', 'playing', 'result']) {\n      document.querySelector(`#${id}`)?.classList.toggle('active', id === 'setup');\n    }\n    document.querySelector('#nick')?.focus();\n  }",
          );

          const fixtures = [
            {
              path: 'tests/e2e/account-protection.e2e.js',
              importBefore: "import { openApplicationPage } from './app-navigation.js';",
              importAfter: "import { openApplicationPage } from './app-navigation.js';\nimport { rasterChallengeResponse } from './raster-human-check-fixture.js';",
              responseBefore: "JSON.stringify({ checkId: '11111111-1111-4111-8111-111111111111', balls, expiresAt: new Date(Date.now() + 120_000).toISOString() })",
              responseAfter: "JSON.stringify(rasterChallengeResponse({ checkId: '11111111-1111-4111-8111-111111111111', expiresAt: new Date(Date.now() + 120_000).toISOString() }))",
            },
            {
              path: 'tests/e2e/bounded-game-and-races.e2e.js',
              importBefore: "import { createRequire } from 'node:module';",
              importAfter: "import { createRequire } from 'node:module';\n\nimport { rasterChallengeResponse } from './raster-human-check-fixture.js';",
              responseBefore: "JSON.stringify({ checkId: '11111111-1111-4111-8111-111111111111', balls, expiresAt: new Date(Date.now() + 120_000).toISOString() })",
              responseAfter: "JSON.stringify(rasterChallengeResponse({ checkId: '11111111-1111-4111-8111-111111111111', expiresAt: new Date(Date.now() + 120_000).toISOString() }))",
            },
            {
              path: 'tests/e2e/league-management.e2e.js',
              importBefore: "import { join } from 'node:path';",
              importAfter: "import { join } from 'node:path';\n\nimport { rasterChallengeResponse } from './raster-human-check-fixture.js';",
              responseBefore: "JSON.stringify({ checkId: '11111111-1111-4111-8111-111111111111', balls: readyBalls, expiresAt: isoAfter(120_000) })",
              responseAfter: "JSON.stringify(rasterChallengeResponse({ checkId: '11111111-1111-4111-8111-111111111111', expiresAt: isoAfter(120_000) }))",
            },
          ];

          for (const fixture of fixtures) {
            replaceOnce(fixture.path, fixture.importBefore, fixture.importAfter);
            replaceOnce(fixture.path, fixture.responseBefore, fixture.responseAfter);
          }
          NODE

          git rm .github/workflows/agent-ci-fix.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/agent-ci-fix.yml \
            .github/workflows/ci.yml \
            public/human-check.js \
            scripts/run-playwright.mjs \
            tests/e2e/account-protection.e2e.js \
            tests/e2e/bounded-game-and-races.e2e.js \
            tests/e2e/league-management.e2e.js | sort)"
          test "$changed" = "$expected"
          node --check public/human-check.js
          node --check scripts/run-playwright.mjs
          node --check tests/e2e/account-protection.e2e.js
          node --check tests/e2e/bounded-game-and-races.e2e.js
          node --check tests/e2e/league-management.e2e.js

      - name: Commit focused fixes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/ci.yml \
            public/human-check.js \
            scripts/run-playwright.mjs \
            tests/e2e/account-protection.e2e.js \
            tests/e2e/bounded-game-and-races.e2e.js \
            tests/e2e/league-management.e2e.js
          git add -u -- .github/workflows/agent-ci-fix.yml
          git commit -m 'fix(test): align raster browser contracts'
          git push origin HEAD:agent/security-ranked-game-anti-cheat
