name: Agent Radar Sync Artifact

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: read-all

concurrency:
  group: agent-radar-sync-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0

      - name: Generate canonical radar loaders
        run: node scripts/sync-player-radar-model.mjs

      - name: Upload generated HTML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent-radar-html-${{ github.event.pull_request.head.sha }}
          path: |
            public/index.html
            public/player.html
            public/ranking.html
            public/cuenta.html
          if-no-files-found: error
          retention-days: 1
