name: Agent Radar Sync Once

on:
  push:
    branches: [agent/security-ranked-game-anti-cheat]

permissions:
  contents: write

concurrency:
  group: agent-radar-sync-once
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.repository == 'juanjoGonDev/106' && github.actor == 'juanjoGonDev'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/security-ranked-game-anti-cheat
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0

      - name: Generate and constrain the change
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-player-radar-model.mjs
          git rm .github/workflows/agent-radar-sync.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/agent-radar-sync.yml \
            public/cuenta.html \
            public/index.html \
            public/player.html \
            public/ranking.html | sort)"
          test "$changed" = "$expected"
          node scripts/sync-player-radar-model.mjs --check

      - name: Commit generated loaders and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/index.html public/player.html public/ranking.html public/cuenta.html
          git commit -m 'chore(sharing): synchronize radar loaders'
          git push origin HEAD:agent/security-ranked-game-anti-cheat
