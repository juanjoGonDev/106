name: Temporary integrity radar synchronization

on:
  push:
    branches:
      - agent/security-ranked-integrity-reconciliation

permissions: read-all

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/security-ranked-integrity-reconciliation

      - name: Synchronize migration-aware radar assets
        run: node scripts/sync-player-radar-model.mjs

      - name: Commit synchronized generated assets and remove helper
        run: |
          rm .github/workflows/agent-radar-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            shared/player-radar-model.js \
            public/player-radar-model.js \
            supabase/functions/_shared/player-radar-model.js \
            public/index.html \
            public/player.html \
            public/ranking.html \
            public/cuenta.html \
            .github/workflows/agent-radar-sync.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'chore(sharing): synchronize integrity renderer revision'
          git push origin HEAD:agent/security-ranked-integrity-reconciliation
